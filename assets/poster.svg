<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title description">
  <title id="title">review-watch session</title>
  <desc id="description">A terminal prints the ripgrep version and a clean file, runs watch.sh until its two-second window ends, then runs it again while a background command appends an AGENT marker to the file; watch.sh prints REVIEW_WATCH_MARKERS and the marker line. A window of 10m is refused with exit status 2, and a missing directory makes it exit with status 3.</desc>
  <rect width="1280" height="960" rx="24" fill="#101418" />
  <circle cx="40" cy="44" r="9" fill="#ff6b6b" />
  <circle cx="70" cy="44" r="9" fill="#ffd166" />
  <circle cx="100" cy="44" r="9" fill="#55d6be" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <text x="40" y="108" fill="#f7fbff" xml:space="preserve">$ watch() { bash skills/review-watch/scripts/watch.sh &quot;$@&quot;; }</text>
    <g class="step-1">
      <text x="40" y="148" fill="#f7fbff" xml:space="preserve">$ rg --version | head -n 1</text>
      <text x="40" y="174" fill="#f7fbff" xml:space="preserve">ripgrep 15.2.0</text>
      <text x="40" y="200" fill="#55d6be" xml:space="preserve">exit status: 0</text>
    </g>
    <g class="step-2">
      <text x="40" y="240" fill="#f7fbff" xml:space="preserve">$ cat worktree/app.py</text>
      <text x="40" y="266" fill="#f7fbff" xml:space="preserve">def total(prices):</text>
      <text x="40" y="292" fill="#f7fbff" xml:space="preserve">    return sum(prices)</text>
      <text x="40" y="318" fill="#55d6be" xml:space="preserve">exit status: 0</text>
    </g>
    <g class="step-3">
      <text x="40" y="358" fill="#f7fbff" xml:space="preserve">$ watch worktree 2 1</text>
      <text x="40" y="384" fill="#f7fbff" xml:space="preserve">REVIEW_WATCH_WINDOW_ENDED</text>
      <text x="40" y="410" fill="#55d6be" xml:space="preserve">exit status: 0</text>
    </g>
    <g class="step-4">
      <text x="40" y="450" fill="#f7fbff" xml:space="preserve">$ (sleep 2; printf &#x27;# AGENT: rename total to subtotal\n&#x27; &gt;&gt; worktree/app.py) &amp; watch worktree 30 1</text>
      <text x="40" y="476" fill="#55d6be" xml:space="preserve">REVIEW_WATCH_MARKERS</text>
      <text x="40" y="502" fill="#55d6be" xml:space="preserve">worktree/app.py:4:# AGENT: rename total to subtotal</text>
      <text x="40" y="528" fill="#55d6be" xml:space="preserve">exit status: 0</text>
    </g>
    <g class="step-5">
      <text x="40" y="568" fill="#f7fbff" xml:space="preserve">$ watch worktree 10m</text>
      <text x="40" y="594" fill="#ffd166" xml:space="preserve">watch.sh: window_seconds must be a whole number of seconds from 0 to 999999999, got &#x27;10m&#x27;</text>
      <text x="40" y="620" fill="#ffd166" xml:space="preserve">usage: watch.sh &lt;watch_path&gt; [window_seconds] [poll_seconds]</text>
      <text x="40" y="646" fill="#ffd166" xml:space="preserve">exit status: 2</text>
    </g>
    <g class="step-6">
      <text x="40" y="686" fill="#f7fbff" xml:space="preserve">$ watch missing-dir 30 1</text>
      <text x="40" y="712" fill="#ffd166" xml:space="preserve">watch.sh: rg exited with status 2 while scanning missing-dir; run it by hand to see the error</text>
      <text x="40" y="738" fill="#ffd166" xml:space="preserve">exit status: 3</text>
    </g>
  </g>
  <text x="40" y="932" fill="#a7bac5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Reconstructed from evidence/transcripts/watch-session.txt</text>
</svg>
